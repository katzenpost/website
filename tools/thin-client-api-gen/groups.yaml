# Pigeonhole geometry
# ---------------------------------------------------------------------------

- group: pigeonhole_geometry
  part: pigeonhole
  section: "Pigeonhole Geometry"
  title: "GetPigeonholeGeometry / pigeonhole_geometry"
  summary: |
    Returns the negotiated Pigeonhole geometry, so that callers can size
    payloads to its maximum plaintext payload length.
  notes: |
    The Python binding has no getter method; it exposes the Pigeonhole
    geometry as the public `ThinClient.pigeonhole_geometry` attribute,
    populated from the daemon's connection status event.
  go:   "ThinClient.GetPigeonholeGeometry"
  rust: "ThinClient::pigeonhole_geometry"

