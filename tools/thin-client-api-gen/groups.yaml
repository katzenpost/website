  rust:   "ThinClient::new_surb_id"
  python: "ThinClient.new_surb_id"

- group: new_query_id
  part: core
  section: "Utility"
  title: "NewQueryID / new_query_id"
  summary: |
    Returns a new random query ID for correlating requests and replies
    within the thin client protocol.
  go:     "ThinClient.NewQueryID"
  rust:   "ThinClient::new_query_id"
  python: "ThinClient.new_query_id"

- group: get_config
  part: core
  section: "Utility"
  title: "GetConfig"
  summary: |
    Returns the client's configuration object, including the Sphinx and
    Pigeonhole geometries negotiated with the daemon.
  notes: |
    Python callers read the configuration through the plain `config`
    attribute on `ThinClient`. The Rust binding exposes no configuration
    accessor; Rust callers read the negotiated geometries through the
    dedicated `sphinx_geometry` and `pigeonhole_geometry` methods.
  go:     "ThinClient.GetConfig"

- group: shutdown
  part: core
  section: "Utility"
  title: "Shutdown"
  summary: |
    Cleanly shuts down the ThinClient instance and stops its background
    workers. Unlike Close, it does not send a close notification to the
    daemon.
  notes: |
    The Rust and Python bindings expose a single teardown method, `stop`,
    documented under Close / stop above.
  go: "ThinClient.Shutdown"

- group: get_logger
  part: core
  section: "Utility"
  title: "GetLogger"
  summary: |
    Returns a logger instance with the given prefix, using the thin
    client's configured logging backend.
  notes: |
    The Rust and Python bindings leave logging to the host application
    and expose no equivalent accessor.
  go: "ThinClient.GetLogger"
