# Native pydoc-markdown configuration for the Katzenpost Python thin
# client API page.
#
# This is the real, wired configuration (the lone pydoc-markdown.yml in
# the thin_client repository is an inert scaffold and is not used).
#
# `@SRC@` is a placeholder: generate.py substitutes it with the
# absolute path of a `git archive` export of the pinned thin_client
# tag, so the user's working checkout is never disturbed. The rest of
# this file is plain pydoc-markdown and may be edited as such.

loaders:
  - type: python
    search_path: ["@SRC@"]
    packages: ["katzenpost_thinclient"]

processors:
  # documented_only (default True) discards the noise: bare `import`
  # names, value-less module constants, and the package's re-export
  # aliases all lack docstrings and are dropped. skip_empty_modules
  # then removes the now-hollow top-level package, leaving only the
  # definition-bearing submodules (core, pigeonhole, transport.*).
  - type: filter
    documented_only: true
    skip_empty_modules: true
  - type: smart
  # No crossref processor: nothing in the docstrings uses its #Symbol
  # reference syntax, and it mangles the #fragment of any plain URL
  # (https://...#copy-commands became `copy`-commands).

renderer:
  type: markdown
  # No inline TOC: it rendered as a deep three-level nested list
  # (Docsy draws vertical guide rules per level). Docsy supplies its
  # own right-hand page TOC from the headings, so this is redundant.
  render_toc: false
  render_module_header: true
  descriptive_class_title: false
  add_method_class_prefix: true
  add_member_class_prefix: true
  signature_in_header: false
  signature_code_block: true
  classdef_code_block: true
  # One H1 only (the preamble title). Modules H2, classes H3, members
  # H4, so the page nests sanely under Docsy.
  use_fixed_header_levels: true
  header_level_by_type:
    Module: 2
    Class: 3
    Method: 4
    Function: 3
    Variable: 4
    Data: 4
