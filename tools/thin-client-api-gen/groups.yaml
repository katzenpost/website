# Auxiliary index helpers
# ---------------------------------------------------------------------------

- group: next_message_box_index
  part: pigeonhole
  section: "Auxiliary Index Helpers"
  title: "NextMessageBoxIndex / next_message_box_index"
  summary: |
    Returns the next message box index in the sequence. This is a local
    KDF computation; it does not cause network traffic or store state.
    If you have a BACAP implementation in your language, you can compute
    this locally instead of making a round trip to the daemon.
  go:     "ThinClient.NextMessageBoxIndex"
  rust:   "ThinClient::next_message_box_index"
  python: "ThinClient.next_message_box_index"

- group: get_message_box_index_counter
  part: pigeonhole
  section: "Auxiliary Index Helpers"
  title: "GetMessageBoxIndexCounter / get_message_box_index_counter"
  summary: |
    Returns the BACAP Idx64 counter embedded in a MessageBoxIndex, the
    sequence number of a box within its stream.
  go:     "ThinClient.GetMessageBoxIndexCounter"
  rust:   "ThinClient::get_message_box_index_counter"
  python: "ThinClient.get_message_box_index_counter"

# ===========================================================================
# Part: Core Thin-Client API
# ===========================================================================

# ---------------------------------------------------------------------------
# Connection management
# ---------------------------------------------------------------------------

- group: connect
  part: core
  section: "Connection Management"
  title: "Dial / new / start"
  summary: |
    Connect to the kpclientd daemon. The Rust binding connects during
    construction (`ThinClient::new`), whereas Go and Python construct the
    client first and then connect via `Dial()` / `start()`.
  notes: |
    The Rust binding folds the connect step into its constructor, so
    `ThinClient::new` returns an already-connected handle. Go and
    Python construct the client first and connect afterwards via
    `Dial()` / `start()`, allowing the application to set up event
    sinks (in Go) or callbacks (in Python) before any traffic flows.
  go:     "ThinClient.Dial"
  rust:   "ThinClient::new"
  python: "ThinClient.start"

- group: close
  part: core
  section: "Connection Management"
  title: "Close / stop"
  summary: |
    Disconnect from the daemon and shut down the thin client. All blocked
    callers receive an error.
  go:     "ThinClient.Close"
  rust:   "ThinClient::stop"
  python: "ThinClient.stop"

- group: is_connected
  part: core
  section: "Connection Management"
  title: "IsConnected / is_connected"
  summary: |
    Returns whether the daemon is currently connected to the mixnet.
  go:     "ThinClient.IsConnected"
  rust:   "ThinClient::is_connected"
  python: "ThinClient.is_connected"

- group: disconnect
  part: core
  section: "Connection Management"
  title: "Disconnect / disconnect"
  summary: |
    Disconnect from the daemon without shutting down. The thin client will
    automatically reconnect with exponential backoff.
  go:     "ThinClient.Disconnect"
  rust:   "ThinClient::disconnect"
  python: "ThinClient.disconnect"

# ---------------------------------------------------------------------------
# Events
# ---------------------------------------------------------------------------

- group: event_sink
  part: core
  section: "Events"
  title: "EventSink / event_sink"
  summary: |
    Returns a channel (Go) or receiver (Rust) that yields events from the
    daemon. Python uses async callbacks supplied via the `Config`
    constructor, so has no equivalent method.
  notes: |
    The Rust binding returns an `mpsc::Receiver` carrying the same
    event stream. The Python binding has no equivalent method:
    Python applications instead register async callbacks on the
    `Config` constructor and receive events through those.
  go:     "ThinClient.EventSink"
  rust:   "ThinClient::event_sink"

- group: stop_event_sink
  part: core
  section: "Events"
  title: "StopEventSink"
  summary: |
    Stops delivering events on the given channel. Rust receivers are
    dropped via their own lifetime; Python's callback model requires no
    teardown.
  notes: |
    Rust subscribers are released by dropping the
    `mpsc::Receiver`, so the binding exposes no explicit teardown
    method. Python's callback model owns no per-subscriber
    resources either, and so likewise needs no equivalent.
  go:     "ThinClient.StopEventSink"

# ---------------------------------------------------------------------------
# PKI and service discovery
# ---------------------------------------------------------------------------

- group: pki_document
  part: core
  section: "PKI and Service Discovery"
  title: "PKIDocument / pki_document"
  summary: |
    Returns the current PKI consensus document, which contains the
    network topology and available services.
  go:     "ThinClient.PKIDocument"
  rust:   "ThinClient::pki_document"
  python: "ThinClient.pki_document"

- group: get_pki_document_raw
  part: core
  section: "PKI and Service Discovery"
  title: "GetPKIDocumentRaw / get_pki_document_raw"
  summary: |
    Returns the signed PKI document for a given epoch with every
    directory authority signature intact, so callers may verify the
    document themselves. The cached document received via the standard
    push event has its signature map nulled by the daemon; use this
    method when authority signatures must be checked. Pass `0` for the
    epoch to request the document the daemon believes is current.
  go:     "ThinClient.GetPKIDocumentRaw"
  rust:   "ThinClient::get_pki_document_raw"
  python: "ThinClient.get_pki_document_raw"

- group: get_directory_authorities
  part: core
  section: "PKI and Service Discovery"
  title: "GetDirectoryAuthorities / get_directory_authorities"
  summary: |
    Returns the directory authority descriptors the client daemon is
    configured to trust, including their identity keys and addresses.
  go:     "ThinClient.GetDirectoryAuthorities"
  rust:   "ThinClient::get_directory_authorities"
  python: "ThinClient.get_directory_authorities"

- group: pki_document_for_epoch
  part: core
  section: "PKI and Service Discovery"
  title: "PKIDocumentForEpoch / pki_document_for_epoch"
  summary: |
    Returns the cached PKI document for a specific epoch, or an error if
    the daemon has not retained a document for that epoch.
  notes: |
    The Rust binding does not expose a per-epoch accessor; Rust callers
    use `pki_document` for the current document, or `get_pki_document_raw`
    for the signed document at a given epoch.
  go:     "ThinClient.PKIDocumentForEpoch"
  python: "ThinClient.pki_document_for_epoch"

- group: get_service
  part: core
  section: "PKI and Service Discovery"
  title: "GetService / get_service"
  summary: |
    Returns a random instance of the named service from the PKI document.
    The result contains the destination node hash and queue ID needed for
    sending messages to that service.
  go:     "ThinClient.GetService"
  rust:   "ThinClient::get_service"
  python: "ThinClient.get_service"

- group: get_services
  part: core
  section: "PKI and Service Discovery"
  title: "GetServices / get_services"
  summary: |
    Returns all instances of a service with the given capability name.
    The Rust binding exposes this as a standalone helper in `helpers.rs`,
    not a method on `ThinClient`.
  notes: |
    The Rust binding exposes the same lookup as the free function
    `find_services` in `helpers.rs`, rather than as a method on
    `ThinClient`.
  go:     "ThinClient.GetServices"
  python: "ThinClient.get_services"

# ---------------------------------------------------------------------------
# Direct messaging
# ---------------------------------------------------------------------------

- group: send_message
  part: core
  section: "Direct Messaging"
  title: "SendMessage / send_message"
  traffic: true
  summary: |
    Sends a message with a SURB (Single Use Reply Block) that allows the
    destination service to reply. This method is asynchronous: it returns
    after the daemon accepts the request, not after the message is
    delivered. To receive the reply, monitor events for a
    `MessageReplyEvent` matching the SURB ID. See "Transport and
    Lifecycle Errors" below for the error raised when offline.
  go:     "ThinClient.SendMessage"
  rust:   "ThinClient::send_message"
  python: "ThinClient.send_message"

- group: send_message_without_reply
  part: core
  section: "Direct Messaging"
  title: "SendMessageWithoutReply / send_message_without_reply"
  traffic: true
  summary: |
    Sends a fire-and-forget message with no SURB. The destination cannot
    reply.
  go:     "ThinClient.SendMessageWithoutReply"
  rust:   "ThinClient::send_message_without_reply"
  python: "ThinClient.send_message_without_reply"

- group: blocking_send_message
  part: core
  section: "Direct Messaging"
  title: "BlockingSendMessage / blocking_send_message"
  traffic: true
  summary: |
    Sends a message and blocks until a reply is received or the timeout
    expires. This is a convenience wrapper that generates a SURB ID,
    sends the message, and waits for the matching reply event.
  go:     "ThinClient.BlockingSendMessage"
  rust:   "ThinClient::blocking_send_message"
  python: "ThinClient.blocking_send_message"

# ---------------------------------------------------------------------------
# Sphinx geometry
# ---------------------------------------------------------------------------

- group: sphinx_geometry
  part: core
  section: "Sphinx Geometry"
  title: "GetSphinxGeometry / sphinx_geometry"
  summary: |
    Returns the Sphinx geometry the daemon supplied during the connection
    handshake, describing the packet and payload sizes of the mixnet's
    Sphinx packet format.
  notes: |
    The Python binding has no getter method; it exposes the Sphinx
    geometry as the public `ThinClient.geometry` attribute (a `Geometry`),
    populated from the daemon's connection status event.
  go:   "ThinClient.GetSphinxGeometry"
  rust: "ThinClient::sphinx_geometry"

