name: Render the website

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the render image
        run: docker build -t katzenpost-website-render:local .

      - name: Render the site
        run: |
          docker run --rm -v "$PWD:/site" -w /site katzenpost-website-render:local \
            sh -euc 'npm ci --no-audit --no-fund && hugo --gc --minify'
